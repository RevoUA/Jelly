<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Jelly Lab v31 🪼</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#141414;--card:#1e1e1e;--text:#f0efeb;--muted:#888;--border:#2a2a2a;
    --accent:#3b82f6;--danger:#ef4444;--success:#22c55e;--radius:12px;--font:'Manrope',sans-serif;
  }
  body{background:var(--bg);font-family:var(--font);color:var(--text);max-width:500px;margin:0 auto;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  
  /* HEADER */
  .header{padding:10px 16px 6px;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .app-title{font-weight:800;font-size:16px;letter-spacing:-0.5px;display:flex;align-items:center;gap:5px;}
  
  .sync-status{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
  .dot{width:6px;height:6px;background:var(--success);border-radius:50%;box-shadow:0 0 8px var(--success);animation:pulse 2s infinite;}
  
  @keyframes pulse{
    0% {opacity:1; transform:scale(1);}
    50% {opacity:0.4; transform:scale(1.2); box-shadow:0 0 12px var(--success);}
    100% {opacity:1; transform:scale(1);}
  }

  .search-row{display:flex;gap:8px;align-items:center;}
  .search-input{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:#fff;outline:none;font-size:14px;height:36px;}
  .reset-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.1);color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;}

  /* FILTERS */
  .filters-area{padding:6px 16px;display:flex;flex-direction:column;gap:6px;background:var(--bg);}
  .filter-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .tag{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:0.15s;}
  .tag.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tag.more-btn{border-style:dashed;color:var(--accent);}
  .brand-select{background:var(--card);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:8px;font-size:11px;outline:none;flex:1;height:28px;}

  /* LIST */
  .results{flex:1;overflow-y:auto;padding:6px 16px 100px;}
  .card{background:var(--card);border-radius:var(--radius);padding:8px;display:flex;gap:10px;margin-bottom:8px;align-items:center;border:1px solid var(--border);}
  .card-img{width:54px;height:54px;border-radius:8px;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0;}
  .card-img img{width:100%;height:100%;object-fit:cover;}
  .card-info{flex:1;min-width:0;}
  .card-brand{font-size:9px;font-weight:800;color:var(--accent);text-transform:uppercase;margin-bottom:1px;}
  .card-name{font-size:13px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge-row{display:flex;flex-wrap:wrap;gap:3px;}
  .badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#ccc;}
  .vol-badge{color:var(--accent);border-color:rgba(59,130,246,0.3);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;z-index:100;backdrop-filter:blur(4px);}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:95vh;overflow-y:auto;}
  .field{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:#fff;margin-bottom:10px;font-size:14px;outline:none;}
  .save-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-weight:800;font-size:15px;margin-top:20px;}
  .section-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:10px 0 6px;}

  .fab{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;border:none;width:50px;height:50px;border-radius:25px;font-size:20px;box-shadow:0 8px 20px rgba(0,0,0,0.4);z-index:20;}
  .btn-icon{background:none;border:none;padding:4px;font-size:14px;opacity:0.3;}
</style>
</head>
<body>

<div class="header">
  <div class="top-bar">
    <div class="app-title">🪼 Jelly Lab</div>
    <div class="sync-status">Cloud Sync <div class="dot"></div></div>
  </div>
  <div class="search-row">
    <input type="search" class="search-input" id="search" placeholder="Пошук..." oninput="render()">
    <div class="reset-btn" onclick="resetAll()">✕</div>
  </div>
</div>

<div class="filters-area">
  <div class="filter-row" id="catsRow"></div>
  <div class="filter-row">
    <div id="volRow" style="display:flex; gap:5px;"></div>
    <select class="brand-select" id="brandFilter" onchange="window.activeBrand=this.value; render();"></select>
  </div>
</div>

<div class="results" id="results"></div>
<button class="fab" onclick="openAdd()">＋</button>

<div id="zoomOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;align-items:center;justify-content:center;" onclick="this.style.display='none'">
  <img id="zoomImg" style="max-width:90%;max-height:80%;border-radius:12px;">
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeAdd()">
  <div class="modal">
    <div style="width:30px;height:3px;background:var(--border);margin:0 auto 15px;border-radius:2px;"></div>
    <div onclick="document.getElementById('fileIn').click()" style="width:80px;height:80px;margin:0 auto 15px;border:2px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);">
        <img id="preview" style="display:none;width:100%;height:100%;object-fit:cover;">
        <span id="pLabel" style="font-size:9px;color:var(--muted);">📷 ФОТО</span>
        <input type="file" id="fileIn" hidden accept="image/*" onchange="handleFile(this)">
    </div>
    <input type="text" id="inName" class="field" placeholder="Назва смаку">
    <select id="inBrand" class="field"></select>
    
    <div class="section-label">Об'єм</div>
    <div class="filter-row" id="modalVol"></div>
    
    <div class="section-label">Категорії</div>
    <div id="modalCats" class="filter-row"></div>
    
    <button class="save-btn" onclick="save()">Зберегти смак</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const config = {
    apiKey: "AIzaSyDS4_JP8-KBxMph44EGVVHPyOlbNxZsAdE",
    authDomain: "jellylab-17022.firebaseapp.com",
    projectId: "jellylab-17022",
    databaseURL: "https://jellylab-17022-default-rtdb.europe-west1.firebasedatabase.app"
  };

  const app = initializeApp(config);
  const db = getDatabase(app);

  let flavors = [], cats = {}, brands = [], activeCat = null, activeVol = null, activeBrand = "", selectedCats = new Set(), selectedVol = "30мл", editId = null, base64Img = "", showAllCats = false;
  const volumes = ["10мл", "15мл", "30мл"];

  onValue(ref(db, '/'), s => {
    const d = s.val() || {};
    flavors = d.flavors ? Object.entries(d.flavors).map(([id,v])=>({id,...v})) : [];
    cats = d.categories || {'інше':'✨'};
    brands = (d.brands || []).sort();
    render(); renderFilters();
  });

  window.renderFilters = () => {
    const counts = {};
    flavors.forEach(f => f.cats && f.cats.forEach(c => counts[c] = (counts[c]||0)+1));
    const sortedCats = Object.keys(cats).sort((a,b) => (counts[b]||0) - (counts[a]||0));
    
    let catHtml = '';
    sortedCats.forEach((c, idx) => {
      if (showAllCats || idx < 3 || c === activeCat) {
        catHtml += `<div class="tag ${activeCat===c?'active':''}" onclick="toggleCat('${c}')">${cats[c]} ${c}</div>`;
      }
    });
    if (sortedCats.length > 3) {
      catHtml += `<div class="tag more-btn" onclick="window.showAllCats=!window.showAllCats; renderFilters()">${showAllCats?'▴':'Ще ▾'}</div>`;
    }
    document.getElementById('catsRow').innerHTML = catHtml;
    document.getElementById('volRow').innerHTML = volumes.map(v => `<div class="tag ${activeVol===v?'active':''}" onclick="toggleVol('${v}')">${v}</div>`).join('');
    const bSelect = document.getElementById('brandFilter');
    bSelect.innerHTML = `<option value="">Бренди: Всі</option>` + brands.map(b => `<option value="${b}" ${activeBrand===b?'selected':''}>${b}</option>`).join('');
  };

  window.toggleCat = (c) => { activeCat = (activeCat === c) ? null : c; render(); renderFilters(); };
  window.toggleVol = (v) => { activeVol = (activeVol === v) ? null : v; render(); renderFilters(); };
  window.resetAll = () => { document.getElementById('search').value = ""; activeCat = null; activeVol = null; activeBrand = ""; showAllCats = false; render(); renderFilters(); };

  window.render = () => {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = flavors.filter(f => 
      (f.name.toLowerCase().includes(q) || f.brand.toLowerCase().includes(q)) &&
      (!activeCat || (f.cats && f.cats.includes(activeCat))) &&
      (!activeVol || f.vol === activeVol) &&
      (!activeBrand || f.brand === activeBrand)
    ).sort((a,b) => a.name.localeCompare(b.name));

    document.getElementById('results').innerHTML = filtered.map(f => `
      <div class="card">
        <div class="card-img" onclick="if('${f.img}') zoom('${f.img}')">${f.img ? `<img src="${f.img}">` : '🪼'}</div>
        <div class="card-info">
          <div class="card-brand">${f.brand}</div>
          <div class="card-name">${f.name}</div>
          <div class="badge-row">
            <span class="badge vol-badge">${f.vol || '30мл'}</span>
            ${(f.cats||[]).map(c => `<span class="badge">${cats[c]||'✨'} ${c}</span>`).join('')}
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn-icon" onclick="openEdit('${f.id}')">✏️</button>
          <button class="btn-icon" onclick="del('${f.id}')">🗑</button>
        </div>
      </div>`).join('');
  };

  window.openAdd = () => {
    editId = null; base64Img = ""; selectedVol = "30мл";
    document.getElementById('inName').value = "";
    document.getElementById('preview').style.display = 'none';
    document.getElementById('pLabel').style.display = 'block';
    document.getElementById('inBrand').innerHTML = brands.map(b=>`<option value="${b}">${b}</option>`).join('');
    selectedCats = new Set(['інше']);
    renderModalVol(); renderModalCats();
    document.getElementById('modal').classList.add('open');
  };

  window.openEdit = (id) => {
    const f = flavors.find(x => x.id === id);
    openAdd(); editId = id;
    document.getElementById('inName').value = f.name;
    document.getElementById('inBrand').value = f.brand;
    selectedVol = f.vol || "30мл";
    if(f.img) { base64Img = f.img; document.getElementById('preview').src = f.img; document.getElementById('preview').style.display = 'block'; document.getElementById('pLabel').style.display = 'none'; }
    selectedCats = new Set(f.cats || []);
    renderModalVol(); renderModalCats();
  };

  window.renderModalVol = () => {
    document.getElementById('modalVol').innerHTML = volumes.map(v => `
      <div class="tag ${selectedVol===v?'active':''}" onclick="window.selectedVol='${v}'; renderModalVol()">${v}</div>`).join('');
  };

  window.renderModalCats = () => {
    document.getElementById('modalCats').innerHTML = Object.keys(cats).map(c => `
      <div class="tag ${selectedCats.has(c)?'active':''}" onclick="toggleMC('${c}')">${cats[c]} ${c}</div>`).join('');
  };

  window.toggleMC = (c) => {
    if(selectedCats.has(c)) selectedCats.delete(c);
    else selectedCats.add(c);
    renderModalCats();
  };
  
  window.save = async () => {
    const name = document.getElementById('inName').value.trim();
    const brand = document.getElementById('inBrand').value;
    if(!name || !brand) return;
    const data = { name, brand, vol: selectedVol, img: base64Img, cats: Array.from(selectedCats), ts: Date.now() };
    if(editId) await update(ref(db, `flavors/${editId}`), data);
    else await push(ref(db, 'flavors'), data);
    closeAdd();
  };

  window.handleFile = (el) => {
    const file = el.files[0]; if(!file) return;
    const img = new Image(); img.src = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas'); canvas.width = 300; canvas.height = 300;
      const ctx = canvas.getContext('2d'); const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, 300, 300);
      base64Img = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('preview').src = base64Img; document.getElementById('preview').style.display = 'block';
      document.getElementById('pLabel').style.display = 'none';
    };
  };

  window.zoom = (src) => { document.getElementById('zoomImg').src = src; document.getElementById('zoomOverlay').style.display = 'flex'; };
  window.del = (id) => { if(confirm("Видалити?")) remove(ref(db, `flavors/${id}`)); };
  window.closeAdd = () => document.getElementById('modal').classList.remove('open');
</script>
</body>
</html>
