<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Jelly Lab</title>

<link rel="apple-touch-icon" href="https://img.icons8.com/emoji/180/test-tube-emoji.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#f5f4f0;--card:#fff;--text:#1a1a1a;--muted:#888;--border:#e8e6e0;
    --accent:#2563eb;--accent-bg:#eff6ff;--accent-text:#1d4ed8;
    --radius:14px;--radius-sm:9px;--font:'Manrope',sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{--bg:#141414;--card:#1e1e1e;--text:#f0efeb;--muted:#666;--border:#2a2a2a;
    --accent:#3b82f6;--accent-bg:#1e3a5f;--accent-text:#93c5fd;}
  }
  html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--text);overflow:hidden;}
  body{display:flex;flex-direction:column;max-width:520px;margin:0 auto;}

  .header{padding:20px 16px 12px;background:var(--bg);z-index:10;}
  .logo{font-size:18px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .tools-btn{font-size:10px; opacity:0.8; cursor:pointer; padding:6px 12px; border:1.5px solid var(--border); border-radius:8px; font-weight:800; background:var(--card); text-transform:uppercase; color:var(--text);}
  
  .search-wrap{position:relative;}
  .search-input{
    width:100%;padding:13px 44px;font-size:16px;font-family:var(--font);font-weight:500;
    border-radius:var(--radius);border:1.5px solid var(--border);
    background:var(--card);color:var(--text);outline:none;
  }
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;}

  .tags-container{padding:4px 16px 10px; display:flex; flex-wrap:wrap; gap:6px; background:var(--bg);}
  .tag{
    padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600;
    cursor:pointer; border:1.5px solid var(--border); background:var(--card); color:var(--muted);
    transition:0.2s; white-space:nowrap;
  }
  .tag.active{background:var(--accent-bg); border-color:var(--accent); color:var(--accent-text);}

  .stats-bar{padding:4px 16px 8px; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between;}
  .manage-link{color:var(--accent); cursor:pointer; text-decoration:underline;}

  .results{flex:1; overflow-y:auto; padding:0 16px 120px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; display:flex; align-items:flex-start; gap:12px; margin-bottom:8px;
  }
  .card-icon-wrap{display:flex; gap:2px; flex-wrap:wrap; width:42px; font-size:18px; justify-content:center;}
  .card-body{flex:1; min-width:0;}
  .card-name{font-size:15px; font-weight:700;}
  .card-brand{font-size:13px; color:var(--muted); margin-bottom:6px;}
  .badge-list{display:flex; flex-wrap:wrap; gap:4px;}
  .badge{font-size:9px; font-weight:800; padding:2px 6px; border-radius:4px; background:var(--accent-bg); color:var(--accent-text); text-transform:uppercase;}
  
  .card-right{display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
  .action-btn{background:none; border:none; font-size:16px; cursor:pointer; padding:4px; color:var(--muted);}

  .fab{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; border:none; padding:15px 30px; border-radius:999px; font-size:15px; font-weight:800; box-shadow:0 8px 20px rgba(37,99,235,.3); z-index:20;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px);}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card); border-radius:24px 24px 0 0; width:100%; max-width:520px; padding:20px; max-height:90vh; overflow-y:auto;}
  .modal-handle{width:40px; height:5px; background:var(--border); border-radius:3px; margin:0 auto 20px;}
  
  .field-input{width:100%; padding:12px; font-size:16px; font-family:var(--font); margin-bottom:12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); outline:none;}
  .cat-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .cat-pill{padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; border:1.5px solid var(--border); cursor:pointer;}
  .cat-pill.selected{background:var(--accent-bg); border-color:var(--accent); color:var(--accent-text);}
  
  .btn-row{display:flex; gap:10px; margin-bottom:10px;}
  .btn{flex:1; padding:15px; border-radius:var(--radius-sm); border:none; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-sub{background:var(--bg); color:var(--muted); border:1.5px solid var(--border);}
  
  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:8px 16px; border-radius:999px; font-size:13px; opacity:0; transition:0.3s; z-index:100; pointer-events:none;}
  .toast.show{opacity:1;}
  #csvInput{display:none;}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>🧪 Jelly Lab</span><button class="tools-btn" onclick="openToolsModal()">🛠 Інструменти</button></div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search-input" id="search" type="search" placeholder="Пошук смаку..." autocomplete="off">
  </div>
</div>

<div class="tags-container" id="tagRow"></div>
<div class="stats-bar"><span id="statsCount">0 смаків</span><span class="manage-link" onclick="openCatModal()">⚙ Категорії</span></div>
<div class="results" id="results"></div>

<button class="fab" onclick="openModalForAdd()">➕ Додати смак</button>

<div class="modal-overlay" id="toolsOverlay" onclick="if(event.target===this) closeToolsModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 style="text-align:center; margin-bottom:20px;">Інструменти</h3>
    <button class="btn btn-primary" style="width:100%; margin-bottom:10px;" onclick="exportData()">Бекап (JSON)</button>
    <button class="btn btn-sub" style="width:100%; margin-bottom:10px;" onclick="document.getElementById('csvInput').click()">Імпорт CSV</button>
    <input type="file" id="csvInput" accept=".csv" onchange="importCSV(event)">
    <button class="btn btn-sub" style="width:100%; margin-top:20px;" onclick="closeToolsModal()">Закрити</button>
  </div>
</div>

<div class="modal-overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modalTitle" style="text-align:center; margin-bottom:20px;">Смак</h3>
    <input type="hidden" id="editFlavorId">
    <input class="field-input" id="inName" placeholder="Назва">
    <input class="field-input" id="inBrand" placeholder="Бренд">
    <div class="cat-grid" id="catGrid"></div>
    <div class="btn-row">
      <button class="btn btn-sub" onclick="closeModal()">Скасувати</button>
      <button class="btn btn-primary" onclick="saveFlavor()">Зберегти</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="catOverlay" onclick="if(event.target===this) closeCatModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 style="margin-bottom:15px">Категорії</h3>
    <div id="catEditList" style="margin-bottom:20px; display:flex; flex-direction:column; gap:8px;"></div>
    <input class="field-input" id="newCatInput" placeholder="Приклад: 🍍 Ананас">
    <button class="btn btn-primary" style="width:100%" onclick="addNewCategory()">Додати категорію</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ЛОГІКА ЗБЕРЕЖЕННЯ (v14)
let db = JSON.parse(localStorage.getItem('jelly_v14_db')) || [];
let categories = JSON.parse(localStorage.getItem('jelly_v14_cats')) || {
  'фрукти':'🍓','цитрус':'🍋','ягоди':'🍇','десерт':'🍰','ментол':'❄️','тютюн':'🌿','напій':'🥤','інше':'✨'
};

let activeFilters = new Set();
let selectedModalCats = new Set();

function save() {
  localStorage.setItem('jelly_v14_db', JSON.stringify(db));
  localStorage.setItem('jelly_v14_cats', JSON.stringify(categories));
}

function getIcon(c) { return categories[c.toLowerCase()] || '✨'; }

function renderTags() {
  document.getElementById('tagRow').innerHTML = Object.keys(categories).map(c => 
    `<span class="tag ${activeFilters.has(c)?'active':''}" onclick="toggleFilter('${c}')">${getIcon(c)} ${c}</span>`
  ).join('');
}

function renderResults() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = db.filter(f => {
    const mSearch = f.name.toLowerCase().includes(q) || f.brand.toLowerCase().includes(q);
    const mCat = activeFilters.size === 0 || f.cats.some(c => activeFilters.has(c));
    return mSearch && mCat;
  });
  document.getElementById('statsCount').textContent = `${filtered.length} смаків`;
  const container = document.getElementById('results');
  container.innerHTML = filtered.length ? filtered.map(f => `
    <div class="card">
      <div class="card-icon-wrap">${f.cats.map(c => getIcon(c)).join('')}</div>
      <div class="card-body">
        <div class="card-name">${f.name}</div>
        <div class="card-brand">${f.brand}</div>
        <div class="badge-list">${f.cats.map(c => `<span class="badge">${getIcon(c)} ${c}</span>`).join('')}</div>
      </div>
      <div class="card-right">
        <button class="action-btn" onclick="openModalForEdit(${f.id})">✏️</button>
        <button class="action-btn" onclick="deleteFlavor(${f.id})">🗑</button>
      </div>
    </div>
  `).join('') : `<div style="text-align:center; padding:40px; color:var(--muted)">Порожньо</div>`;
}

function toggleFilter(c) {
  activeFilters.has(c) ? activeFilters.delete(c) : activeFilters.add(c);
  renderTags(); renderResults();
}

function openModalForAdd() {
  document.getElementById('modalTitle').textContent = "Новий смак";
  document.getElementById('editFlavorId').value = "";
  document.getElementById('inName').value = "";
  document.getElementById('inBrand').value = "Jelly Lab";
  selectedModalCats = new Set(['інше']);
  openModal();
}

function openModalForEdit(id) {
  const f = db.find(x => x.id === id);
  document.getElementById('modalTitle').textContent = "Редагування";
  document.getElementById('editFlavorId').value = f.id;
  document.getElementById('inName').value = f.name;
  document.getElementById('inBrand').value = f.brand;
  selectedModalCats = new Set(f.cats);
  openModal();
}

function saveFlavor() {
  const name = document.getElementById('inName').value.trim();
  const brand = document.getElementById('inBrand').value.trim();
  const editId = document.getElementById('editFlavorId').value;
  if(!name || !selectedModalCats.size) return showToast("Заповніть назву");
  const catsArr = Array.from(selectedModalCats);
  if(editId) {
    const idx = db.findIndex(x => x.id == editId);
    db[idx] = { ...db[idx], name, brand, cats: catsArr };
  } else {
    db.unshift({ id: Date.now(), name, brand, cats: catsArr });
  }
  save(); renderResults(); closeModal();
}

function deleteFlavor(id) {
  if(!confirm("Видалити?")) return;
  db = db.filter(x => x.id !== id);
  save(); renderResults();
}

function addNewCategory() {
  const val = document.getElementById('newCatInput').value.trim();
  if(!val) return;
  const match = val.match(/(\p{Emoji_Presentation}|\p{Emoji})\s*(.+)/u);
  let icon = '✨', name = val;
  if(match) { icon = match[1]; name = match[2].trim(); }
  categories[name.toLowerCase()] = icon;
  document.getElementById('newCatInput').value = '';
  save(); renderCatEditList(); renderTags(); renderResults();
}

function deleteCategory(name) {
  if(Object.keys(categories).length <= 1) return;
  delete categories[name];
  db.forEach(f => { 
    f.cats = f.cats.filter(c => c !== name); 
    if(!f.cats.length) f.cats = ['інше'];
  });
  save(); renderCatEditList(); renderTags(); renderResults();
}

function renderCatEditList() {
  document.getElementById('catEditList').innerHTML = Object.entries(categories).map(([name, icon]) => `
    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:10px; border-radius:12px; border:1px solid var(--border);">
      <span><b style="font-size:18px">${icon}</b> ${name}</span>
      <button onclick="deleteCategory('${name}')" style="border:none; color:red; background:none; cursor:pointer; font-weight:700;">🗑</button>
    </div>
  `).join('');
}

function importCSV(e) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.split('\n').filter(l => l.trim());
    lines.forEach(line => {
      const p = line.split(',').map(s => s.trim().replace(/^"|"$/g,''));
      if(p[0]) db.push({ id: Date.now() + Math.random(), name: p[0], brand: p[1]||'', cats: [(p[2]||'інше').toLowerCase()] });
    });
    save(); renderResults(); closeToolsModal();
  };
  reader.readAsText(file, 'UTF-8');
}

function exportData() {
  const blob = new Blob([JSON.stringify({db, categories}, null, 2)], {type: "application/json"});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `jelly_lab.json`; a.click();
}

function openToolsModal() { document.getElementById('toolsOverlay').classList.add('open'); }
function closeToolsModal() { document.getElementById('toolsOverlay').classList.remove('open'); }
function openCatModal() { document.getElementById('catOverlay').classList.add('open'); renderCatEditList(); }
function closeCatModal() { document.getElementById('catOverlay').classList.remove('open'); }
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }
function openModal() { document.getElementById('overlay').classList.add('open'); renderCatGridInModal(); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function renderCatGridInModal() {
  document.getElementById('catGrid').innerHTML = Object.keys(categories).map(c => 
    `<span class="cat-pill ${selectedModalCats.has(c)?'selected':''}" onclick="toggleModalCat('${c}')">${getIcon(c)} ${c}</span>`
  ).join('');
}
function toggleModalCat(c) {
  selectedModalCats.has(c) ? selectedModalCats.delete(c) : selectedModalCats.add(c);
  renderCatGridInModal();
}

document.getElementById('search').oninput = renderResults;
renderTags(); renderResults();
</script>
</body>
</html>
