<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Jelly Lab v45 🪼</title>

<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/jellyfish.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#141414;--card:#1e1e1e;--text:#f0efeb;--muted:#888;--border:#2a2a2a;
    --accent:#3b82f6;--danger:#ef4444;--success:#22c55e;--radius:12px;--font:'Manrope',sans-serif;
  }
  body{background:var(--bg);font-family:var(--font);color:var(--text);max-width:500px;margin:0 auto;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  
  .header{padding:10px 16px 6px;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .app-title{font-weight:800;font-size:16px;}
  .sync-status{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;}
  .dot{width:6px;height:6px;background:var(--success);border-radius:50%;box-shadow:0 0 8px var(--success);animation:pulse 2s infinite ease-in-out;}
  @keyframes pulse{ 0%{opacity:1;transform:scale(1);} 50%{opacity:0.3;transform:scale(1.3);} 100%{opacity:1;transform:scale(1);} }

  .search-row{display:flex;gap:8px;padding:0 16px 8px;}
  .search-input{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:#fff;outline:none;font-size:14px;height:36px;}
  .reset-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(239,68,68,0.1);background:rgba(239,68,68,0.05);color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;}

  .filters-area{padding:0 16px 10px;display:flex;flex-direction:column;gap:8px;}
  .filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tag{padding:6px 12px;border-radius:10px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;user-select:none;}
  .tag.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tag.more-btn{border-style:dashed;color:var(--accent);font-weight:800;}
  
  .brand-select{background:var(--card);color:var(--text);border:1px solid var(--border);padding:0 8px;border-radius:8px;font-size:11px;outline:none;flex:1;height:30px;}

  .results{flex:1;overflow-y:auto;padding:0 16px 100px;}
  .card{background:var(--card);border-radius:var(--radius);padding:10px;display:flex;gap:12px;margin-bottom:10px;align-items:center;border:1px solid var(--border);}
  .card-img{width:54px;height:54px;border-radius:8px;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0;cursor:pointer;}
  .card-img img{width:100%;height:100%;object-fit:cover;}
  .card-info{flex:1;min-width:0;cursor:pointer;}
  .card-brand{font-size:9px;font-weight:800;color:var(--accent);text-transform:uppercase;}
  .card-name{font-size:14px;font-weight:700;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge-row{display:flex;flex-wrap:wrap;gap:4px;}
  .badge{font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#ccc;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;z-index:100;backdrop-filter:blur(4px);}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:24px;max-height:90vh;overflow-y:auto;}
  .field{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:#fff;margin-bottom:12px;font-size:14px;outline:none;}
  .section-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:12px 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .manage-btn{color:var(--accent);font-size:14px;cursor:pointer;padding:4px;}
  
  .save-btn{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-weight:800;font-size:15px;margin-top:20px;cursor:pointer;}
  .fab{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;border:none;width:56px;height:56px;border-radius:28px;font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:20;cursor:pointer;}

  #zoomOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;align-items:center;justify-content:center;}
  .manage-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:6px;border:1px solid var(--border);}
</style>
</head>
<body>

<div class="header">
  <div class="top-bar">
    <div class="app-title">🪼 Jelly Lab</div>
    <div class="sync-status">Cloud Sync <div class="dot"></div></div>
  </div>
</div>
<div class="search-row">
  <input type="search" class="search-input" id="search" placeholder="Пошук смаку..." oninput="render()">
  <div class="reset-btn" onclick="resetAll()">✕</div>
</div>

<div class="filters-area">
  <div class="filter-row" id="catsRow"></div>
  <div class="filter-row">
    <div id="volRow" style="display:flex; gap:6px;"></div>
    <select class="brand-select" id="brandFilter" onchange="window.activeBrand=this.value; render();"></select>
  </div>
</div>

<div class="results" id="results"></div>
<button class="fab" onclick="openAdd()">＋</button>

<div id="zoomOverlay" onclick="this.style.display='none'">
  <img id="zoomImg" style="max-width:90%;max-height:80%;border-radius:12px;object-fit:contain;">
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeAdd()">
  <div class="modal">
    <div style="width:40px;height:4px;background:var(--border);margin:0 auto 20px;border-radius:2px;"></div>
    <div onclick="document.getElementById('fileIn').click()" style="width:80px;height:80px;margin:0 auto 16px;border:2px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);cursor:pointer;">
        <img id="preview" style="display:none;width:100%;height:100%;object-fit:cover;">
        <span id="pLabel" style="font-size:10px;color:var(--muted);">📷 ФОТО</span>
        <input type="file" id="fileIn" hidden accept="image/*" onchange="handleFile(this)">
    </div>
    <div class="section-label">Бренд <span class="manage-btn" onclick="openManage('brands')">⚙️</span></div>
    <select id="inBrand" class="field"></select>
    <div class="section-label">Назва смаку</div>
    <input type="text" id="inName" class="field" placeholder="Напр. Банан Полуниця">
    <div class="section-label">Об'єм</div>
    <div class="filter-row" id="modalVol" style="margin-bottom:12px;"></div>
    <div class="section-label">Категорії <span class="manage-btn" onclick="openManage('cats')">⚙️</span></div>
    <div id="modalCats" class="filter-row"></div>
    <button class="save-btn" onclick="save()">Зберегти смак</button>
  </div>
</div>

<div class="modal-overlay" id="manageModal" style="z-index:110;" onclick="if(event.target===this) this.classList.remove('open')">
  <div class="modal" style="height:80vh;">
    <div class="section-label" id="manageTitle"></div>
    <div id="manageContent" style="margin-bottom:20px;"></div>
    <button class="save-btn" style="background:var(--border);" onclick="document.getElementById('manageModal').classList.remove('open')">Назад</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const config = {
    apiKey: "AIzaSyDS4_JP8-KBxMph44EGVVHPyOlbNxZsAdE",
    authDomain: "jellylab-17022.firebaseapp.com",
    projectId: "jellylab-17022",
    databaseURL: "https://jellylab-17022-default-rtdb.europe-west1.firebasedatabase.app"
  };

  const app = initializeApp(config);
  const db = getDatabase(app);

  let flavors = [], cats = {}, brands = [], activeCat = null, activeVol = null, activeBrand = "", editId = null, base64Img = "";
  
  // КЛЮЧОВЕ: Глобальні стейти для вибору в модалці
  window.selectedCats = new Set();
  window.selectedVol = "30мл";
  window.isExpanded = false;

  const volumes = ["10мл", "15мл", "30мл"];

  onValue(ref(db, '/'), s => {
    const d = s.val() || {};
    flavors = d.flavors ? Object.entries(d.flavors).map(([id,v])=>({id,...v})) : [];
    cats = d.categories || {'інше':'✨'};
    brands = (d.brands || []).sort();
    render(); renderFilters();
  });

  window.toggleCat = (c) => { activeCat = (activeCat === c) ? null : c; render(); renderFilters(); };
  window.toggleVol = (v) => { activeVol = (activeVol === v) ? null : v; render(); renderFilters(); };
  window.resetAll = () => { document.getElementById('search').value = ""; activeCat = null; activeVol = null; activeBrand = ""; window.isExpanded = false; render(); renderFilters(); };

  window.renderFilters = () => {
    const sc = Object.keys(cats).sort();
    let h = '';
    sc.forEach((c, i) => { 
      if (window.isExpanded || i < 3 || c === activeCat) {
        h += `<div class="tag ${activeCat===c?'active':''}" onclick="toggleCat('${c}')">${cats[c]} ${c}</div>`;
      }
    });
    if (sc.length > 3) {
      h += `<div class="tag more-btn" onclick="window.isExpanded=!window.isExpanded; renderFilters();">${window.isExpanded ? '▴ Згорнути' : 'Ще ▾'}</div>`;
    }
    document.getElementById('catsRow').innerHTML = h;
    document.getElementById('volRow').innerHTML = volumes.map(v => `<div class="tag ${activeVol===v?'active':''}" onclick="toggleVol('${v}')">${v}</div>`).join('');
    document.getElementById('brandFilter').innerHTML = `<option value="">Всі бренди</option>` + brands.map(b => `<option value="${b}" ${activeBrand===b?'selected':''}>${b}</option>`).join('');
  };

  window.render = () => {
    const q = document.getElementById('search').value.toLowerCase();
    const fArr = flavors.filter(f => 
      (f.name.toLowerCase().includes(q) || (f.brand && f.brand.toLowerCase().includes(q))) &&
      (!activeCat || (f.cats && f.cats.includes(activeCat))) &&
      (!activeVol || f.vol === activeVol) &&
      (!activeBrand || f.brand === activeBrand)
    ).sort((a,b) => a.name.localeCompare(b.name));

    document.getElementById('results').innerHTML = fArr.map(f => `
      <div class="card">
        <div class="card-img" onclick="if('${f.img}') zoom('${f.img}')">${f.img ? `<img src="${f.img}">` : '🪼'}</div>
        <div class="card-info" onclick="openEdit('${f.id}')">
          <div class="card-brand">${f.brand || ''}</div>
          <div class="card-name">${f.name}</div>
          <div class="badge-row">
            <span class="badge" style="color:var(--accent); border-color:rgba(59,130,246,0.3)">${f.vol || '30мл'}</span>
            ${(f.cats||[]).map(c => `<span class="badge">${cats[c]||'✨'} ${c}</span>`).join('')}
          </div>
        </div>
        <span style="opacity:0.2; padding:10px; cursor:pointer;" onclick="delFlavor('${f.id}')">🗑</span>
      </div>`).join('');
  };

  window.zoom = (s) => { document.getElementById('zoomImg').src = s; document.getElementById('zoomOverlay').style.display = 'flex'; };

  // ЛОГІКА МОДАЛКИ
  window.toggleMC = (c) => { 
    if(window.selectedCats.has(c)) window.selectedCats.delete(c); 
    else window.selectedCats.add(c); 
    renderModalCats(); 
  };
  window.renderModalCats = () => { 
    document.getElementById('modalCats').innerHTML = Object.keys(cats).map(c => 
      `<div class="tag ${window.selectedCats.has(c)?'active':''}" onclick="toggleMC('${c}')">${cats[c]} ${c}</div>`
    ).join(''); 
  };
  window.setModalVol = (v) => { window.selectedVol = v; renderModalVol(); };
  window.renderModalVol = () => { document.getElementById('modalVol').innerHTML = volumes.map(v => `<div class="tag ${window.selectedVol===v?'active':''}" onclick="setModalVol('${v}')">${v}</div>`).join(''); };

  window.openAdd = () => {
    editId = null; base64Img = ""; window.selectedVol = "30мл"; window.selectedCats = new Set(['інше']);
    document.getElementById('inName').value = ""; 
    document.getElementById('preview').style.display = 'none'; 
    document.getElementById('pLabel').style.display = 'block';
    document.getElementById('inBrand').innerHTML = `<option value="">Оберіть бренд</option>` + brands.map(b=>`<option value="${b}">${b}</option>`).join('');
    renderModalVol(); renderModalCats();
    document.getElementById('modal').classList.add('open');
  };

  window.openEdit = (id) => {
    const f = flavors.find(x => x.id === id); 
    editId = id; base64Img = f.img || ""; window.selectedVol = f.vol || "30мл";
    window.selectedCats = new Set(f.cats || []); // ПРИМУСОВИЙ SET ДЛЯ МУЛЬТИСЕЛЕКТУ
    document.getElementById('inName').value = f.name;
    document.getElementById('inBrand').innerHTML = `<option value="">Оберіть бренд</option>` + brands.map(b=>`<option value="${b}" ${f.brand===b?'selected':''}>${b}</option>`).join('');
    if(f.img) { document.getElementById('preview').src = f.img; document.getElementById('preview').style.display = 'block'; document.getElementById('pLabel').style.display = 'none'; }
    else { document.getElementById('preview').style.display = 'none'; document.getElementById('pLabel').style.display = 'block'; }
    renderModalVol(); renderModalCats();
    document.getElementById('modal').classList.add('open');
  };

  window.save = async () => {
    const n = document.getElementById('inName').value.trim();
    const b = document.getElementById('inBrand').value;
    if(!n || !b) return alert("Заповніть назву та бренд!");
    const d = { name:n, brand:b, vol:window.selectedVol, img:base64Img, cats:Array.from(window.selectedCats), ts:Date.now() };
    if(editId) await update(ref(db, `flavors/${editId}`), d);
    else await push(ref(db, 'flavors'), d);
    closeAdd();
  };

  window.openManage = (t) => {
    const m = document.getElementById('manageModal'); m.classList.add('open');
    const c = document.getElementById('manageContent');
    if(t==='brands') {
      document.getElementById('manageTitle').innerHTML = `Бренди <span onclick="addB()" style="color:var(--accent); cursor:pointer;">+ Додати</span>`;
      c.innerHTML = brands.map(b => `<div class="manage-list-item"><span>${b}</span><span onclick="delB('${b}')">🗑</span></div>`).join('');
    } else {
      document.getElementById('manageTitle').innerHTML = `Категорії <span onclick="addC()" style="color:var(--accent); cursor:pointer;">+ Додати</span>`;
      c.innerHTML = Object.entries(cats).map(([n,e]) => `<div class="manage-list-item"><span>${e} ${n}</span><span onclick="delC('${n}')">🗑</span></div>`).join('');
    }
  };

  window.addB = () => { const n = prompt("Бренд:"); if(n) set(ref(db, 'brands'), [...brands, n]); openManage('brands'); };
  window.delB = (n) => { if(confirm("Видалити?")) set(ref(db, 'brands'), brands.filter(x=>x!==n)); openManage('brands'); };
  window.addC = () => { const n = prompt("Назва:"), e = prompt("Емодзі:","✨"); if(n) update(ref(db,'categories'),{[n]:e}); openManage('cats'); };
  window.delC = (n) => { if(confirm("Видалити?")) remove(ref(db,`categories/${n}`)); openManage('cats'); };

  window.handleFile = (el) => {
    const f = el.files[0]; if(!f) return;
    const img = new Image(); img.src = URL.createObjectURL(f);
    img.onload = () => {
      const cvs = document.createElement('canvas'); cvs.width=300; cvs.height=300;
      const ctx = cvs.getContext('2d'); const m = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, 300, 300);
      base64Img = cvs.toDataURL('image/jpeg', 0.7);
      document.getElementById('preview').src = base64Img; document.getElementById('preview').style.display='block'; document.getElementById('pLabel').style.display='none';
    };
  };

  window.delFlavor = (id) => { if(confirm("Видалити?")) remove(ref(db, `flavors/${id}`)); };
  window.closeAdd = () => document.getElementById('modal').classList.remove('open');
</script>
</body>
</html>
