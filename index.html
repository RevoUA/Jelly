<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Jelly Lab Pro v23 📸⚡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#141414;--card:#1e1e1e;--text:#f0efeb;--muted:#666;--border:#2a2a2a;
    --accent:#3b82f6;--radius:16px;--font:'Manrope',sans-serif;
  }
  body{background:var(--bg);font-family:var(--font);color:var(--text);max-width:520px;margin:0 auto;display:flex;flex-direction:column;height:100vh;}
  
  .header{padding:16px;background:var(--bg);position:sticky;top:0;z-index:10;}
  .search-input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:#fff;outline:none;font-size:16px;}
  
  .tags-wrapper{padding:0 16px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
  .tag{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);white-space:nowrap;color:var(--muted);}
  .tag.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .results{flex:1;overflow-y:auto;padding:0 16px 100px;}
  .card{background:var(--card);border-radius:var(--radius);padding:10px;display:flex;gap:12px;margin-bottom:10px;align-items:center;border:1px solid var(--border);}
  
  .card-img{width:70px;height:70px;border-radius:10px;background:var(--bg);object-fit:cover;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;}
  
  .card-info{flex:1;min-width:0;}
  .card-brand{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;margin-bottom:2px;}
  .card-name{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.2;}
  
  .badge-row{display:flex;flex-wrap:wrap;gap:4px;}
  .badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.05);color:var(--text);border:1px solid rgba(255,255,255,0.1);}

  .card-btns{display:flex;flex-direction:column;gap:12px;padding-right:4px;}
  .btn-icon{background:none;border:none;cursor:pointer;font-size:16px;opacity:0.5;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;z-index:100;backdrop-filter:blur(5px);}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:24px;max-height:95vh;overflow-y:auto;}
  
  .img-preview-box{width:120px;height:120px;margin:0 auto 20px;border-radius:16px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg);}
  .img-preview-box img{width:100%;height:100%;object-fit:cover;}
  .img-label{font-size:10px;text-align:center;color:var(--muted);font-weight:700;}

  .field{width:100%;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:#fff;margin-bottom:12px;font-family:var(--font);font-size:16px;outline:none;}
  .save-btn{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-weight:800;font-size:16px;margin-top:10px;transition:0.2s;}
  .save-btn:disabled{opacity:0.5;filter:grayscale(1);}

  .fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;padding:16px 32px;border-radius:50px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:20;}
</style>
</head>
<body>

<div class="header">
  <div style="font-weight:800;font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;">
    <span>🧪 Jelly Lab Pro</span>
    <span style="font-size:10px;color:var(--muted)">v23⚡</span>
  </div>
  <input type="search" class="search-input" id="search" placeholder="Пошук смаку..." oninput="render()">
</div>

<div class="tags-wrapper" id="tags"></div>
<div class="results" id="results"></div>

<button class="fab" onclick="openAdd()">➕ Новий смак</button>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeAdd()">
  <div class="modal">
    <div style="width:40px;height:4px;background:var(--border);margin:0 auto 20px;border-radius:2px;"></div>
    
    <div class="img-preview-box" onclick="document.getElementById('fileIn').click()">
      <img id="preview" src="" style="display:none;">
      <div class="img-label" id="imgPlaceholder">📷<br>Додати фото</div>
      <input type="file" id="fileIn" hidden accept="image/*" onchange="handleFile(this)">
    </div>

    <input type="text" id="inName" class="field" placeholder="Наприклад: Банан Полуниця">
    <select id="inBrand" class="field"></select>
    
    <div style="font-size:10px;font-weight:800;color:var(--muted);margin-bottom:8px;text-transform:uppercase;">Категорії:</div>
    <div id="modalCats" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;"></div>

    <button class="save-btn" id="saveBtn" onclick="save()">Зберегти</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

  const config = {
    apiKey: "AIzaSyDS4_JP8-KBxMph44EGVVHPyOlbNxZsAdE",
    authDomain: "jellylab-17022.firebaseapp.com",
    projectId: "jellylab-17022",
    storageBucket: "jellylab-17022.firebasestorage.app",
    databaseURL: "https://jellylab-17022-default-rtdb.europe-west1.firebasedatabase.app"
  };

  const app = initializeApp(config);
  const db = getDatabase(app);
  const storage = getStorage(app);

  let flavors = [], cats = {}, brands = [], activeFilter = null, selectedCats = new Set(), editId = null, compressedBlob = null;

  onValue(ref(db, '/'), s => {
    const d = s.val() || {};
    flavors = d.flavors ? Object.entries(d.flavors).map(([id,v])=>({id,...v})) : [];
    cats = d.categories || {'інше':'✨'};
    brands = d.brands || [];
    render(); renderTags();
  });

  // ФУНКЦІЯ СТИСНЕННЯ (500px + Square Crop)
  async function handleFile(el) {
    const file = el.files[0];
    if(!file) return;

    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = 500;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Обрізка в квадрат (center crop)
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2;
      const sy = (img.height - minSide) / 2;

      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      
      canvas.toBlob((blob) => {
        compressedBlob = blob;
        document.getElementById('preview').src = URL.createObjectURL(blob);
        document.getElementById('preview').style.display = 'block';
        document.getElementById('imgPlaceholder').style.display = 'none';
      }, 'image/jpeg', 0.8);
    };
  }

  window.save = async () => {
    const name = document.getElementById('inName').value.trim();
    const brand = document.getElementById('inBrand').value;
    if(!name || !brand) return alert("Вкажіть назву та бренд");

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.innerText = "Завантаження...";

    let imgUrl = editId ? flavors.find(f=>f.id===editId).img : "";

    if(compressedBlob) {
      const sLink = sRef(storage, `flavors/${Date.now()}.jpg`);
      await uploadBytes(sLink, compressedBlob);
      imgUrl = await getDownloadURL(sLink);
    }

    const data = { name, brand, img: imgUrl, cats: Array.from(selectedCats), ts: Date.now() };
    if(editId) await update(ref(db, `flavors/${editId}`), data);
    else await push(ref(db, 'flavors'), data);
    
    closeAdd();
  };

  window.render = () => {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = flavors.filter(f => 
      (f.name.toLowerCase().includes(q) || f.brand.toLowerCase().includes(q)) &&
      (!activeFilter || f.cats.includes(activeFilter))
    ).sort((a,b) => a.name.localeCompare(b.name));

    document.getElementById('results').innerHTML = filtered.map(f => `
      <div class="card">
        <div class="card-img">${f.img ? `<img src="${f.img}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">` : '🧪'}</div>
        <div class="card-info">
          <div class="card-brand">${f.brand}</div>
          <div class="card-name">${f.name}</div>
          <div class="badge-row">
            ${f.cats.map(c => `<span class="badge">${cats[c]||'✨'} ${c}</span>`).join('')}
          </div>
        </div>
        <div class="card-btns">
          <button class="btn-icon" onclick="openEdit('${f.id}')">✏️</button>
          <button class="btn-icon" onclick="del('${f.id}')">🗑</button>
        </div>
      </div>
    `).join('');
  };

  window.renderTags = () => {
    document.getElementById('tags').innerHTML = Object.keys(cats).map(c => `
      <div class="tag ${activeFilter===c?'active':''}" onclick="toggleF('${c}')">${cats[c]} ${c}</div>
    `).join('');
  };

  window.toggleF = (c) => { activeFilter = (activeFilter === c) ? null : c; render(); renderTags(); };
  
  window.openAdd = () => {
    editId = null; compressedBlob = null;
    document.getElementById('inName').value = "";
    document.getElementById('fileIn').value = "";
    document.getElementById('preview').style.display = 'none';
    document.getElementById('imgPlaceholder').style.display = 'block';
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('saveBtn').innerText = "Зберегти";
    
    const bSel = document.getElementById('inBrand');
    bSel.innerHTML = `<option value="" disabled selected>Бренд</option>` + brands.map(b=>`<option value="${b}">${b}</option>`).join('');
    
    selectedCats = new Set(['інше']);
    renderModalCats();
    document.getElementById('modal').classList.add('open');
  };

  window.openEdit = (id) => {
    const f = flavors.find(x => x.id === id);
    openAdd();
    editId = id;
    document.getElementById('inName').value = f.name;
    document.getElementById('inBrand').value = f.brand;
    if(f.img) {
      document.getElementById('preview').src = f.img;
      document.getElementById('preview').style.display = 'block';
      document.getElementById('imgPlaceholder').style.display = 'none';
    }
    selectedCats = new Set(f.cats);
    renderModalCats();
  };

  window.renderModalCats = () => {
    document.getElementById('modalCats').innerHTML = Object.keys(cats).map(c => `
      <div class="tag ${selectedCats.has(c)?'active':''}" onclick="toggleMC('${c}')">${cats[c]} ${c}</div>
    `).join('');
  };

  window.toggleMC = (c) => { 
    selectedCats.has(c) ? selectedCats.delete(c) : selectedCats.add(c); 
    renderModalCats(); 
  };

  window.del = (id) => { if(confirm("Видалити?")) remove(ref(db, `flavors/${id}`)); };
  window.closeAdd = () => document.getElementById('modal').classList.remove('open');
</script>
</body>
</html>
