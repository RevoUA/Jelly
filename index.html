<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Jelly Lab v28 🧪</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#141414;--card:#1e1e1e;--text:#f0efeb;--muted:#666;--border:#2a2a2a;
    --accent:#3b82f6;--radius:16px;--font:'Manrope',sans-serif;
  }
  body{background:var(--bg);font-family:var(--font);color:var(--text);max-width:520px;margin:0 auto;display:flex;flex-direction:column;height:100vh;}
  
  .header{padding:20px 16px 8px;background:var(--bg);position:sticky;top:0;z-index:10;}
  .app-title{font-weight:800;font-size:22px;margin-bottom:16px;letter-spacing:-0.5px;}
  .search-input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:#fff;outline:none;font-size:16px;}
  
  /* SMART HYBRID TAGS */
  .tags-container{padding:0 16px 16px;}
  .tags-flex{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;}
  .tag.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tag.more-btn{background:none;border-style:dashed;color:var(--accent);border-color:rgba(59,130,246,0.4);}

  .results{flex:1;overflow-y:auto;padding:0 16px 100px;}
  .card{background:var(--card);border-radius:var(--radius);padding:12px;display:flex;gap:14px;margin-bottom:12px;align-items:center;border:1px solid var(--border);}
  .card-img{width:74px;height:74px;border-radius:12px;background:var(--bg);object-fit:cover;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;}
  .card-img img{width:100%;height:100%;object-fit:cover;}
  
  .card-info{flex:1;min-width:0;}
  .card-brand{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;margin-bottom:4px;letter-spacing:0.5px;}
  .card-name{font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.25;}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,0.05);color:var(--text);border:1px solid rgba(255,255,255,0.1);}

  .btn-icon{background:none;border:none;cursor:pointer;font-size:18px;opacity:0.4;}

  #zoomOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(15px);}
  #zoomImg{max-width:100%;max-height:70vh;border-radius:20px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:flex-end;z-index:100;backdrop-filter:blur(8px);}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);width:100%;border-radius:28px 28px 0 0;padding:28px;max-height:90vh;overflow-y:auto;}
  
  .field{width:100%;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:14px;color:#fff;margin-bottom:16px;font-size:16px;outline:none;}
  .save-btn{width:100%;padding:18px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-weight:800;font-size:17px;margin-top:10px;}

  .fab{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;padding:18px 36px;border-radius:50px;font-weight:800;z-index:20;display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>

<div class="header">
  <div class="app-title">🧪 Jelly Lab</div>
  <input type="search" class="search-input" id="search" placeholder="Пошук смаку..." oninput="render()">
</div>

<div class="tags-container" id="tagsContainer">
  <div class="tags-flex" id="tags"></div>
</div>

<div class="results" id="results"></div>

<button class="fab" onclick="openAdd()">➕ Додати смак</button>

<div id="zoomOverlay" onclick="this.style.display='none'">
  <img id="zoomImg" src="">
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeAdd()">
  <div class="modal">
    <div style="width:45px;height:5px;background:var(--border);margin:0 auto 24px;border-radius:10px;"></div>
    <div onclick="document.getElementById('fileIn').click()" style="width:120px;height:120px;margin:0 auto 20px;border:2px dashed var(--border);border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);">
        <img id="preview" style="display:none;width:100%;height:100%;object-fit:cover;">
        <span id="pLabel" style="font-size:10px;color:var(--muted);text-align:center;">📷<br>ФОТО</span>
        <input type="file" id="fileIn" hidden accept="image/*" onchange="handleFile(this)">
    </div>
    <input type="text" id="inName" class="field" placeholder="Назва смаку">
    <select id="inBrand" class="field"></select>
    <div id="modalCats" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;"></div>
    <button class="save-btn" onclick="save()">Зберегти</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const config = {
    apiKey: "AIzaSyDS4_JP8-KBxMph44EGVVHPyOlbNxZsAdE",
    authDomain: "jellylab-17022.firebaseapp.com",
    projectId: "jellylab-17022",
    databaseURL: "https://jellylab-17022-default-rtdb.europe-west1.firebasedatabase.app"
  };

  const app = initializeApp(config);
  const db = getDatabase(app);

  let flavors = [], cats = {}, brands = [], activeFilter = null, selectedCats = new Set(), editId = null, base64Img = "", showAllCats = false;

  onValue(ref(db, '/'), s => {
    const d = s.val() || {};
    flavors = d.flavors ? Object.entries(d.flavors).map(([id,v])=>({id,...v})) : [];
    cats = d.categories || {'інше':'✨'};
    brands = d.brands || [];
    render(); renderTags();
  });

  window.renderTags = () => {
    const keys = Object.keys(cats);
    const container = document.getElementById('tags');
    let html = '';
    
    // Відображаємо або всі, або лише активну + перші 3
    keys.forEach((c, idx) => {
      if (showAllCats || c === activeFilter || idx < 3) {
        html += `<div class="tag ${activeFilter===c?'active':''}" onclick="toggleF('${c}')">${cats[c]} ${c}</div>`;
      }
    });

    if (!showAllCats && keys.length > 3) {
      html += `<div class="tag more-btn" onclick="showAll()">Всі категорії ▾</div>`;
    } else if (showAllCats) {
      html += `<div class="tag more-btn" onclick="showAll()">Згорнути ▴</div>`;
    }

    container.innerHTML = html;
  };

  window.showAll = () => { showAllCats = !showAllCats; renderTags(); };
  window.toggleF = (c) => { activeFilter = (activeFilter === c) ? null : c; render(); renderTags(); };

  window.zoom = (src) => { document.getElementById('zoomImg').src = src; document.getElementById('zoomOverlay').style.display = 'flex'; };

  window.handleFile = (el) => {
    const file = el.files[0];
    if(!file) return;
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = 300;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, size, size);
      base64Img = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('preview').src = base64Img;
      document.getElementById('preview').style.display = 'block';
      document.getElementById('pLabel').style.display = 'none';
    };
  };

  window.save = async () => {
    const name = document.getElementById('inName').value.trim();
    const brand = document.getElementById('inBrand').value;
    if(!name || !brand) return;
    const data = { name, brand, img: base64Img, cats: Array.from(selectedCats), ts: Date.now() };
    if(editId) await update(ref(db, `flavors/${editId}`), data);
    else await push(ref(db, 'flavors'), data);
    closeAdd();
  };

  window.render = () => {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = flavors.filter(f => 
      (f.name.toLowerCase().includes(q) || f.brand.toLowerCase().includes(q)) &&
      (!activeFilter || f.cats.includes(activeFilter))
    ).sort((a,b) => a.name.localeCompare(b.name));

    document.getElementById('results').innerHTML = filtered.map(f => `
      <div class="card">
        <div class="card-img" onclick="if('${f.img}') zoom('${f.img}')">${f.img ? `<img src="${f.img}">` : '🧪'}</div>
        <div class="card-info">
          <div class="card-brand">${f.brand}</div>
          <div class="card-name">${f.name}</div>
          <div class="badge-row">${f.cats.map(c => `<span class="badge">${cats[c]||'✨'} ${c}</span>`).join('')}</div>
        </div>
        <div class="card-btns">
          <button class="btn-icon" onclick="openEdit('${f.id}')">✏️</button>
          <button class="btn-icon" onclick="del('${f.id}')">🗑</button>
        </div>
      </div>`).join('');
  };

  window.openAdd = () => {
    editId = null; base64Img = "";
    document.getElementById('inName').value = "";
    document.getElementById('preview').style.display = 'none';
    document.getElementById('pLabel').style.display = 'block';
    document.getElementById('inBrand').innerHTML = `<option value="" disabled selected>Виберіть бренд</option>` + brands.map(b=>`<option value="${b}">${b}</option>`).join('');
    selectedCats = new Set(['інше']);
    renderModalCats();
    document.getElementById('modal').classList.add('open');
  };

  window.openEdit = (id) => {
    const f = flavors.find(x => x.id === id);
    openAdd(); editId = id;
    document.getElementById('inName').value = f.name;
    document.getElementById('inBrand').value = f.brand;
    if(f.img) { base64Img = f.img; document.getElementById('preview').src = f.img; document.getElementById('preview').style.display = 'block'; document.getElementById('pLabel').style.display = 'none'; }
    selectedCats = new Set(f.cats);
    renderModalCats();
  };

  window.renderModalCats = () => {
    document.getElementById('modalCats').innerHTML = Object.keys(cats).map(c => `
      <div class="tag ${selectedCats.has(c)?'active':''}" onclick="toggleMC('${c}')">${cats[c]} ${c}</div>`).join('');
  };

  window.toggleMC = (c) => { selectedCats.has(c) ? selectedCats.delete(c) : selectedCats.add(c); renderModalCats(); };
  window.del = (id) => { if(confirm("Видалити?")) remove(ref(db, `flavors/${id}`)); };
  window.closeAdd = () => document.getElementById('modal').classList.remove('open');
</script>
</body>
</html>
